name: master_ji
descripion: "MasterJi – OMR sheet checker for teachers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Existing
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.2
  path_provider: ^2.1.5
  opencv_dart: ^2.2.2

  # State & Navigation
  provider: ^6.1.2
  go_router: ^14.6.2

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Localisation
  intl: ^0.20.2

  # Animations
  flutter_animate: ^4.5.0
  animations: ^2.0.11

  # Fonts
  google_fonts: ^6.2.1

  # Native (system) splash, shown before Flutter draws its first frame
  flutter_native_splash: ^2.4.4

  # Utilities
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  device_info_plus: ^11.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon — design C from assets/masterji_icons/icon/C ("Mj" mark
# with an OMR bubble on teal). After changing this, run:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon_1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon/adaptive_background_432.png
  adaptive_icon_foreground: assets/icon/adaptive_foreground_432.png
  min_sdk_android: 21

# Native splash: teal background + MasterJi logo, so it blends into the
# Flutter splash screen. After changing this, run:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#12A07A"
  image: assets/images/splash_logo.png
  android_12:
    color: "#12A07A"
    image: assets/images/splash_logo.png
  fullscreen: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/splash_logo.png
    - assets/icon/icon_1024.png
